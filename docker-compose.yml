name: du-verify

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/duverify
      BASE_URL: http://localhost:5000
      FRONTEND_URL: http://localhost:5173
      FRONTEND_URLS: http://localhost:5173,http://localhost:5174
      GOOGLE_CALLBACK_URL: http://localhost:5000/api/auth/google/callback
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy

  merchant-client:
    build:
      context: ./client
      args:
        VITE_APP_SURFACE: merchant
        VITE_DEVELOPER_PORTAL_URL: http://localhost:5174
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      server:
        condition: service_healthy

  developer-client:
    build:
      context: ./client
      args:
        VITE_APP_SURFACE: developer
        VITE_DEVELOPER_PORTAL_URL: http://localhost:5174
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  mongo-data:
