name: CI and CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: du-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Syntax check server entrypoint
        run: node --check src/server.js

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: false
          tags: du-verify-api:${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Build merchant and staff image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: false
          tags: du-verify-client:${{ github.sha }}
          build-args: VITE_APP_SURFACE=merchant
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client
      - name: Build developer portal image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: false
          tags: du-verify-developer:${{ github.sha }}
          build-args: VITE_APP_SURFACE=developer
          cache-from: type=gha,scope=developer
          cache-to: type=gha,mode=max,scope=developer

  deploy:
    name: Production deploy hooks
    runs-on: ubuntu-latest
    needs: [backend, frontend, containers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      VERCEL_MERCHANT_DEPLOY_HOOK: ${{ secrets.VERCEL_MERCHANT_DEPLOY_HOOK }}
      VERCEL_DEVELOPER_DEPLOY_HOOK: ${{ secrets.VERCEL_DEVELOPER_DEPLOY_HOOK }}
    steps:
      - name: Trigger configured deployments
        shell: bash
        run: |
          set -euo pipefail
          triggered=0
          for hook in "$RENDER_DEPLOY_HOOK" "$VERCEL_MERCHANT_DEPLOY_HOOK" "$VERCEL_DEVELOPER_DEPLOY_HOOK"; do
            if [ -n "$hook" ]; then
              curl --fail --silent --show-error --retry 3 --request POST "$hook"
              triggered=$((triggered + 1))
            fi
          done
          if [ "$triggered" -eq 0 ]; then
            echo "No deploy hooks configured; Vercel/Render Git integrations may handle CD directly."
          else
            echo "Triggered $triggered production deployment(s)."
          fi
